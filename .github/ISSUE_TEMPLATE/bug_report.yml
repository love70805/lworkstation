name: Bug report
description: Report a reproducible Lworkstation defect
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please remove account information, business data, cookies, tokens, and local database contents before submitting. Security vulnerabilities must be reported privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Lworkstation version
      placeholder: 0.2.6-beta.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Attach sanitized evidence only. Do not include private business or account data.
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, cookies, business data, and personal information.
          required: true
