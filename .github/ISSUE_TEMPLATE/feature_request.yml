name: Feature request
description: Propose a focused improvement to Lworkstation
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result rather than only a visual treatment.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Business or data constraints
      description: Note any ERP, 1688, CNY, ledger, evidence, or compatibility constraints.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
