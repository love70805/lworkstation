services:
  postgres:
    image: postgres:16-alpine
    container_name: shopeers-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopeers
      POSTGRES_PASSWORD: ${SHOPEERS_POSTGRES_PASSWORD:?Set a unique local database password in the root .env file}
      POSTGRES_DB: shopeers
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - shopeers-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopeers -d shopeers"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  shopeers-postgres-data:
