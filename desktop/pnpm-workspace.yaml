  'ajv@8.20.0>fast-uri': 3.1.8
  'plist@3.1.0>@xmldom/xmldom': 0.8.15
  'brace-expansion@>=1 <2': 1.1.21
  'brace-expansion@>=2 <3': 2.1.7
  'brace-expansion@>=5 <6': 5.0.12
  'cacheable-request@7.0.4>http-cache-semantics': 4.3.0
  # Builder packages the installed electronDist; Electron uses @electron/get 5.
  # Drop the unused legacy proxy optional dependency with unpatched sprintf-js.
  '@electron/get@3.1.0>global-agent': '-'
